[tool.poetry]
name = "dino-decision-ai"
version = "0.1.0"
description = "Autonomous Multi-Agent RL System for Chrome Dinosaur Game with Laya Router"
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.scripts]
dino-ai = "src.cli.main:app"

[tool.poetry.dependencies]
python = "^3.10"
gymnasium = ">=0.28.0"
stable-baselines3 = ">=2.0.0"
torch = ">=2.0.0"
torchvision = ">=0.15.0"
opencv-python = ">=4.7.0"
numpy = ">=1.24.0"
matplotlib = ">=3.7.0"
pandas = ">=2.0.0"
mss = ">=7.0.1"
pydirectinput = ">=1.0.4"
pytesseract = ">=0.3.10"
laya = ">=0.3.13"
fastapi = ">=0.104.0"
uvicorn = ">=0.24.0"
pydantic = ">=2.0.0"
websockets = ">=12.0"
rich = ">=13.0.0"
tqdm = ">=4.60.0"  # progress bar in `train` (SB3 progress_bar=True)
loguru = ">=0.7.0"
line-profiler = ">=4.0.0"
psutil = ">=5.9.0"
typer = ">=0.9.0"
playwright = ">=1.40"

[tool.poetry.group.dev.dependencies]
jupyter = ">=1.0.0"
pytest = ">=7.3.0"
pytest-cov = ">=4.1.0"
black = ">=23.0.0"
mypy = ">=1.0.0"
isort = ">=5.12.0"
types-psutil = ">=5.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
